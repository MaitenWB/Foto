<!DOCTYPE html>
<html language="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador del Triángulo de Exposición</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent: #58a6ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        .controls, .preview-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .value-display {
            color: var(--accent);
            font-weight: bold;
            float: right;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 8px;
        }
        .checkbox-group {
            margin: 15px 0;
            padding: 10px;
            background: #21262d;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
        /* Vista previa simulada con CSS */
        .image-preview {
            width: 100%;
            height: 250px;
            background: url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=1000') center/cover;
            border-radius: 8px;
            transition: filter 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .blur-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            transition: filter 0.2s ease;
            pointer-events: none;
        }
        .noise-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
            mix-blend-mode: overlay;
        }
        .motion-blur {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Panel de Controles -->
    <div class="controls">
        <h2>Parámetros de Exposición</h2>
        
        <div class="checkbox-group">
            <input type="checkbox" id="lockExposure">
            <label for="lockExposure" style="display:inline; cursor:pointer;">
                <strong>Bloquear Exposición</strong> (Modo Recíproco)
            </label>
        </div>

        <div class="control-group">
            <label>Diafragma (Apertura) <span id="apertureVal" class="value-display">f/4</span></label>
            <input type="range" id="aperture" min="0" max="6" value=3 step="1">
        </div>

        <div class="control-group">
            <label>Velocidad de Obturación <span id="shutterVal" class="value-display">1/125</span></label>
            <input type="range" id="shutter" min="0" max="6" value="3" step="1">
        </div>

        <div class="control-group">
            <label>ISO (Sensibilidad) <span id="isoVal" class="value-display">400</span></label>
            <input type="range" id="iso" min="0" max="6" value="3" step="1">
        </div>
    </div>

    <!-- Panel de Previsualización -->
    <div class="preview-container">
        <div class="image-preview" id="preview">
            <div class="blur-layer" id="blurLayer"></div>
            <div class="motion-blur" id="motionLayer"></div>
            <div class="noise-layer" id="noiseLayer"></div>
        </div>
        <p style="text-align: center; margin-top: 15px;">
            Exposición Total: <span id="exposureStatus" style="font-weight:bold;">Correcta</span>
        </p>
    </div>
</div>

<script>
    // Valores reales en pasos enteros de luz (Stops)
    const apertures = ["f/1.4", "f/2", "f/2.8", "f/4", "f/5.6", "f/8", "f/11"];
    const shutters  = ["1/15", "1/30", "1/60", "1/125", "1/250", "1/500", "1/1000"];
    const isos      = ["100", "200", "400", "800", "1600", "3200", "6400"];

    // Elementos del DOM
    const inputAp = document.getElementById('aperture');
    const inputSh = document.getElementById('shutter');
    const inputIso = document.getElementById('iso');
    const lockCheck = document.getElementById('lockExposure');

    // Variable para rastrear qué slider se movió último
    let lastChanged = inputAp;

    function updateSimulation(e) {
        let apIdx = parseInt(inputAp.value);
        let shIdx = parseInt(inputSh.value);
        let isoIdx = parseInt(inputIso.value);

        // --- LÓGICA DE DEPENDENCIA (RECIPROCIDAD) ---
        if (lockCheck.checked && e) {
            let target = e.target;
            // Calculamos cuántos pasos se movió el slider actual respecto a su posición anterior
            // Para simplificar: si bloqueamos la expo, sacrificamos otro parámetro para compensar.
            if (target === inputAp && lastChanged !== inputAp) {
                let diff = apIdx - parseInt(target.dataset.old || apIdx);
                // Si abro diafragma (apIdx baja -> entra más luz), aumento velocidad para restar luz
                // El slider de Apertura en el HTML: 0 es f/1.4 (más luz), 6 es f/11 (menos luz)
                let newSh = shIdx - diff; 
                if (newSh >= 0 && newSh <= 6) { inputSh.value = newSh; shIdx = newSh; }
                else {
                    let newIso = isoIdx + diff;
                    if (newIso >= 0 && newIso <= 6) { inputIso.value = newIso; isoIdx = newIso; }
                }
            } else if (target === inputIso && lastChanged !== inputIso) {
                let diff = isoIdx - parseInt(target.dataset.old || isoIdx);
                let newSh = shIdx + diff; // Más ISO -> Más velocidad para compensar
                if (newSh >= 0 && newSh <= 6) { inputSh.value = newSh; shIdx = newSh; }
                else {
                    let newAp = apIdx + diff;
                    if (newAp >= 0 && newAp <= 6) { inputAp.value = newAp; apIdx = newAp; }
                }
            } else if (target === inputSh && lastChanged !== inputSh) {
                let diff = shIdx - parseInt(target.dataset.old || shIdx);
                let newIso = isoIdx + diff; // Más velocidad -> Más ISO para compensar
                if (newIso >= 0 && newIso <= 6) { inputIso.value = newIso; isoIdx = newIso; }
                else {
                    let newAp = apIdx - diff;
                    if (newAp >= 0 && newAp <= 6) { inputAp.value = newAp; apIdx = newAp; }
                }
            }
        }

        // Guardar valores actuales como "viejos" para el próximo movimiento
        inputAp.dataset.old = apIdx;
        inputSh.dataset.old = shIdx;
        inputIso.dataset.old = isoIdx;
        if(e) lastChanged = e.target;

        // --- ACTUALIZAR TEXTOS ---
        document.getElementById('apertureVal').innerText = apertures[apIdx];
        document.getElementById('shutterVal').innerText = shutters[shIdx];
        document.getElementById('isoVal').innerText = isos[isoIdx];

        // --- CÁLCULO VISUAL DE EXPOSICIÓN ---
        // f/1.4 (idx 0) da mucha luz (+3). f/11 (idx 6) da poca luz (-3).
        let lightAp = 3 - apIdx;
        // 1/15 (idx 0) da mucha luz (+3). 1/1000 (idx 6) da poca luz (-3).
        let lightSh = 3 - shIdx;
        // ISO 100 (idx 0) da poca luz (-3). ISO 6400 (idx 6) da mucha luz (+3).
        let lightIso = isoIdx - 3;

        // La suma ideal en el centro de los sliders (3, 3, 3) debería dar 0.
        let totalExposure = lightAp + lightSh + lightIso;

        // Modificar el brillo de la imagen basado en el resultado matemático
        // 1 es normal. Cada paso altera un 30% el brillo.
        let brightness = 1 + (totalExposure * 0.3);
        document.getElementById('preview').style.filter = `brightness(${brightness})`;

        // --- EFECTOS SECUNDARIOS ESTÉTICOS ---
        // 1. Ruido por ISO (Opacidad de la capa de ruido)
        document.getElementById('noiseLayer').style.opacity = (isoIdx * 0.15);

        // 2. Desenfoque de fondo por Diafragma (Apertura grande = más blur de fondo)
        // Simulamos el fondo desenfocado aplicando blur inverso al índice
        let bokeh = Math.max(0, (6 - apIdx) * 2);
        document.getElementById('blurLayer').style.filter = `blur(${bokeh}px)`;

        // 3. Motion Blur por velocidad lenta (idx bajo = velocidad lenta = más movido)
        let motion = Math.max(0, (3 - shIdx) * 3);
        let motionLayer = document.getElementById('motionLayer');
        if (shIdx < 3) {
            motionLayer.style.opacity = "0.4";
            motionLayer.style.filter = `blur(${motion}px)`;
        } else {
            motionLayer.style.opacity = "0";
        }

        // --- ESTADO DEL FOTÓMETRO ---
        const statusText = document.getElementById('exposureStatus');
        if (totalExposure === 0) {
            statusText.innerText = "Perfecta (0)";
            statusText.style.color = "#56d364";
        } else if (totalExposure > 0) {
            statusText.innerText = `Sobreexpuesta (+${totalExposure})`;
            statusText.style.color = "#f97583";
        } else {
            statusText.innerText = `Subexpuesta (${totalExposure})`;
            statusText.style.color = "#79c0ff";
        }
    }

    // Escuchar eventos de los sliders
    inputAp.addEventListener('input', updateSimulation);
    inputSh.addEventListener('input', updateSimulation);
    inputIso.addEventListener('input', updateSimulation);

    // Inicializar valores "old" al cargar
    inputAp.dataset.old = inputAp.value;
    inputSh.dataset.old = inputSh.value;
    inputIso.dataset.old = inputIso.value;

    // Ejecutar una vez al inicio
    updateSimulation(null);
</script>

</body>
</html>
